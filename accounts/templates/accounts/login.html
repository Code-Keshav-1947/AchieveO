{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AchieveO</title>
    <link rel="stylesheet" href="{% static "css/index.css" %}">
  </head>
  <body>
    <div class="login-overlay" id="loginOverlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">

    <form class="login-card" id="loginForm" method="post" novalidate>
        {% csrf_token %}
      <div>
        <h2 id="loginTitle">Admin sign in</h2>
        <p>Sign in to manage orders, product costs, and profit.</p>
      </div>
      <div class="field">
        <label for="{{ form.username.id_for_label }}">
            Username
        </label>
        {{form.username}}
      </div>
        <div class="field">
            <label for="{{ form.password.id_for_label }}">
                Password
            </label>
            {{form.password}}
        </div>
        <p class="login-error" id="loginError" aria-live="polite">{{form.error}}</p>
        <button class="btn primary" type="submit">Sign in</button>
    </form>
    <div class="toast" id="toast">
    </div>
    <script src="{% static "js/index.js" %}"></script>
    {% if form.errors %}
        <script>
            showToast("Wrong! Username or Password is incorrect.")
        </script>
    {% endif %}
  </body>
</html>
